<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{% block title %}LUFY study{% endblock %}</title>
<style>
  :root { --ink:#1d1d1f; --muted:#6b6b70; --line:#e3e3e6; --bg:#f7f7f8; --bot:#ffffff; --me:#2f5bd3; --warn:#fff4d6; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 24px 18px 40px; }
  h1 { font-size: 22px; margin: 8px 0 16px; }
  p { margin: 0 0 12px; }
  .muted { color: var(--muted); font-size: 14px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:12px; padding:18px; margin:16px 0; }
  .btn { display:inline-block; border:0; border-radius:10px; padding:12px 18px; font-size:16px;
    background:var(--me); color:#fff; cursor:pointer; text-decoration:none; }
  .btn.secondary { background:#fff; color:var(--ink); border:1px solid var(--line); }
  .btn:disabled { opacity:.5; cursor:default; }
  .error { background:#fde8e8; border-radius:8px; padding:10px 12px; margin:12px 0; }
  .notice { background:var(--warn); border-radius:8px; padding:10px 12px; margin:12px 0; }
  label { display:block; font-weight:600; margin:14px 0 6px; }
  input[type=text], textarea { width:100%; font:inherit; padding:10px 12px; border:1px solid var(--line);
    border-radius:8px; background:#fff; }
  .progress { display:flex; gap:12px; }
  .progress div { flex:1; background:#fff; border:1px solid var(--line); border-radius:10px; padding:10px 12px; }
  .progress b { font-size:20px; }
</style>
{% block head %}{% endblock %}
</head>
<body>{% block body %}<main>{% block main %}{% endblock %}</main>{% endblock %}</body>
</html>
