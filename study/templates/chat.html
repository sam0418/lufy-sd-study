{% extends "base.html" %}
{% block title %}LUFY {{ bot }}{% endblock %}
{% block head %}
<style>
  body { overflow: hidden; }
  .wrap { display:flex; flex-direction:column; height:100dvh; max-width:640px; margin:0 auto; background:var(--bg); }
  header { display:flex; align-items:center; gap:10px; padding:10px 14px; border-bottom:1px solid var(--line); background:#fff; }
  header .who { font-weight:600; flex:1; }
  header .timer { font-variant-numeric: tabular-nums; color:var(--muted); font-size:14px; }
  header .btn { padding:8px 12px; font-size:14px; }
  #banner { display:none; background:var(--warn); padding:8px 14px; font-size:14px; }
  #log { flex:1; overflow-y:auto; padding:14px; }
  .msg { max-width:82%; padding:9px 13px; border-radius:16px; margin:6px 0; white-space:pre-wrap; word-wrap:break-word; }
  .bot { background:var(--bot); border:1px solid var(--line); border-bottom-left-radius:4px; }
  .me { background:var(--me); color:#fff; margin-left:auto; border-bottom-right-radius:4px; }
  .typing { color:var(--muted); font-size:14px; padding:4px 2px; }
  #err { display:none; background:#fde8e8; padding:8px 14px; font-size:14px; }
  form { display:flex; gap:8px; padding:10px 12px calc(10px + env(safe-area-inset-bottom)); border-top:1px solid var(--line); background:#fff; }
  textarea { flex:1; resize:none; max-height:120px; }
</style>
{% endblock %}
{% block body %}
<div class="wrap">
  <header>
    <span class="who">LUFY {{ bot }}</span>
    <span class="timer" id="timer">0:00</span>
    <button class="btn secondary" id="end" type="button">End chat</button>
  </header>
  <div id="banner">{{ target }} minutes reached. You can end the chat whenever you like.</div>
  <div id="err"></div>
  <div id="log" aria-live="polite"></div>
  <form id="f">
    <textarea id="t" rows="1" maxlength="2000" placeholder="Type a message…" autocomplete="off"></textarea>
    <button class="btn" id="send" type="submit">Send</button>
  </form>
</div>
<script>
(() => {
  const token = {{ token|tojson }}, target = {{ target|tojson }};
  const log = document.getElementById('log'), t = document.getElementById('t');
  const send = document.getElementById('send'), err = document.getElementById('err');
  let busy = false, startAt = Date.now();

  const add = (role, text) => {
    const d = document.createElement('div');
    d.className = 'msg ' + (role === 'user' ? 'me' : 'bot');
    d.textContent = text;
    log.appendChild(d);
    log.scrollTop = log.scrollHeight;
    return d;
  };
  const showErr = (m) => { err.textContent = m; err.style.display = m ? 'block' : 'none'; };
  const home = () => { location.href = '/p/' + token; };

  const tick = () => {
    const s = Math.floor((Date.now() - startAt) / 1000);
    document.getElementById('timer').textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
    if (s >= target * 60) document.getElementById('banner').style.display = 'block';
  };

  async function api(path, body) {
    const r = await fetch('/api/' + token + path, body === undefined ? {} :
      {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});
    let data = {};
    try { data = await r.json(); } catch (e) {}
    return [r.status, data];
  }

  async function load() {
    const [status, d] = await api('/chat');
    if (status === 409) return home();
    if (status !== 200) return showErr('Could not load the chat. Please reload the page.');
    startAt = Date.now() - d.elapsed * 1000;
    d.history.forEach(m => add(m.role, m.text));
    tick(); setInterval(tick, 1000);
    t.focus();
  }

  document.getElementById('f').addEventListener('submit', async (e) => {
    e.preventDefault();
    const text = t.value.trim();
    if (!text || busy) return;
    busy = true; send.disabled = true; showErr('');
    add('user', text); t.value = ''; t.style.height = '';
    const typing = document.createElement('div');
    typing.className = 'typing'; typing.textContent = 'LUFY is typing…';
    log.appendChild(typing); log.scrollTop = log.scrollHeight;
    const [status, d] = await api('/turn', {text}).catch(() => [0, {}]);
    typing.remove();
    if (status === 200) add('bot', d.text);
    else if (d.error === 'not_active') return home();
    else {
      log.lastChild.remove(); t.value = text;
      showErr(d.error === 'busy' ? 'Still answering your last message. Please wait a moment.'
                                 : 'Your message was not sent. Please try again.');
    }
    busy = false; send.disabled = false; t.focus();
  });

  t.addEventListener('keydown', (e) => {
    const touch = window.matchMedia('(pointer: coarse)').matches;
    if (e.key === 'Enter' && !e.shiftKey && !touch && !e.isComposing) {
      e.preventDefault(); document.getElementById('f').requestSubmit();
    }
  });
  t.addEventListener('input', () => { t.style.height = ''; t.style.height = Math.min(t.scrollHeight, 120) + 'px'; });

  document.getElementById('end').addEventListener('click', async () => {
    const mins = Math.floor((Date.now() - startAt) / 60000);
    const msg = mins < target
      ? `You have chatted for ${mins} minutes; the study asks for about ${target}. End this chat anyway?`
      : 'End this chat?';
    if (!confirm(msg)) return;
    await api('/stop', {}).catch(() => {});
    home();
  });

  load();
})();
</script>
{% endblock %}
